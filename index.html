<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111, #2b0000);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: 400px;
            max-width: 95%;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        h1 {
            color: #ff3030;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #bbb;
            margin-bottom: 20px;
        }

        .players {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .player {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            background: #222;
            border: 1px solid #444;
        }

        .player.active {
            border-color: red;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .cell {
            height: 100px;
            border: none;
            border-radius: 12px;
            background: #1c1c1c;
            color: white;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .cell:hover {
            background: #2b2b2b;
            transform: scale(1.03);
        }

        .cell.x {
            color: #ff3b3b;
        }

        .cell.o {
            color: #fff;
        }

        .cell.win {
            background: #620000;
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
        }

        #status {
            font-size: 18px;
            margin: 15px 0;
            color: #ddd;
            min-height: 25px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button.control {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .restart {
            background: #e00000;
            color: white;
        }

        .restart:hover {
            background: #ff2222;
        }

        .reset-score {
            background: #333;
            color: white;
        }

        .reset-score:hover {
            background: #444;
        }

        .score {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #444;
        }

        .score div {
            color: #ccc;
        }

        .score span {
            display: block;
            font-size: 24px;
            color: white;
            margin-top: 5px;
        }

        @media (max-width: 450px) {
            .game {
                padding: 18px;
            }

            .cell {
                height: 80px;
                font-size: 34px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Tic Tac Toe</h1>
        <p class="subtitle">Classic X and O Game</p>

        <div class="players">
            <div class="player active" id="playerX">
                Player X
            </div>

            <div class="player" id="playerO">
                Player O
            </div>
        </div>

        <div class="board" id="board">
            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>

            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>

            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>
        </div>

        <div id="status">Player X's Turn</div>

        <div class="buttons">
            <button class="control restart" onclick="restartGame()">
                Restart Game
            </button>

            <button class="control reset-score" onclick="resetScore()">
                Reset Score
            </button>
        </div>

        <div class="score">
            <div>
                X Wins
                <span id="xScore">0</span>
            </div>

            <div>
                Draws
                <span id="drawScore">0</span>
            </div>

            <div>
                O Wins
                <span id="oScore">0</span>
            </div>
        </div>

    </div>

    <script>

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        let xWins = 0;
        let oWins = 0;
        let draws = 0;

        const cells = document.querySelectorAll(".cell");
        const status = document.getElementById("status");

        const winningPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]
        ];

        function makeMove(index) {

            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;

            cells[index].textContent = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());

            checkWinner();
        }

        function checkWinner() {

            let winningPattern = null;

            for (let pattern of winningPatterns) {

                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {
                    winningPattern = pattern;
                    break;
                }
            }

            if (winningPattern) {

                gameOver = true;

                winningPattern.forEach(index => {
                    cells[index].classList.add("win");
                });

                status.textContent = "Player " + currentPlayer + " Wins!";

                if (currentPlayer === "X") {
                    xWins++;
                    document.getElementById("xScore").textContent = xWins;
                } else {
                    oWins++;
                    document.getElementById("oScore").textContent = oWins;
                }

                return;
            }

            if (!board.includes("")) {

                gameOver = true;
                draws++;

                document.getElementById("drawScore").textContent = draws;

                status.textContent = "It's a Draw!";

                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";

            status.textContent = "Player " + currentPlayer + "'s Turn";

            updatePlayer();
        }

        function updatePlayer() {

            document.getElementById("playerX")
                .classList.toggle("active", currentPlayer === "X");

            document.getElementById("playerO")
                .classList.toggle("active", currentPlayer === "O");
        }

        function restartGame() {

            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;

            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove("x", "o", "win");
            });

            status.textContent = "Player X's Turn";

            updatePlayer();
        }

        function resetScore() {

            xWins = 0;
            oWins = 0;
            draws = 0;

            document.getElementById("xScore").textContent = "0";
            document.getElementById("oScore").textContent = "0";
            document.getElementById("drawScore").textContent = "0";

            restartGame();
        }

    </script>

</body>
</html>
