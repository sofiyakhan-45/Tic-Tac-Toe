<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 620px;
    text-align: center;
}

h1 {
    margin-bottom: 10px;
    color: #ff3333;
}

.status {
    margin: 10px 0 20px;
    font-size: 20px;
}

.score {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.score div {
    background: #1d1d1d;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 10px 18px;
    min-width: 100px;
}

.board {
    width: min(90vw, 500px);
    aspect-ratio: 1;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.cell {
    border: 2px solid #ff3333;
    border-radius: 12px;
    background: #1c1c1c;
    color: white;
    font-size: clamp(45px, 10vw, 80px);
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.cell:hover {
    background: #292929;
}

.cell.x {
    color: #ff3333;
}

.cell.o {
    color: white;
}

.buttons {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 16px;
    cursor: pointer;
}

.restart {
    background: #ff3333;
    color: white;
}

.reset {
    background: #333;
    color: white;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    h1 {
        font-size: 30px;
    }

    .status {
        font-size: 17px;
    }

    .score {
        gap: 8px;
    }

    .score div {
        min-width: 85px;
        padding: 8px 10px;
        font-size: 14px;
    }

    .board {
        gap: 5px;
    }

    .cell {
        border-radius: 8px;
    }

    button {
        width: 100%;
        max-width: 250px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>Tic-Tac-Toe</h1>

    <div class="status" id="status">
        Player X's Turn
    </div>

    <div class="score">
        <div>
            Player X:
            <span id="scoreX">0</span>
        </div>

        <div>
            Player O:
            <span id="scoreO">0</span>
        </div>

        <div>
            Draws:
            <span id="draws">0</span>
        </div>
    </div>

    <div class="board" id="board"></div>

    <div class="buttons">
        <button class="restart" onclick="restartGame()">
            Restart Game
        </button>

        <button class="reset" onclick="resetScore()">
            Reset Score
        </button>
    </div>

</div>

<script>

const board = document.getElementById("board");
const statusText = document.getElementById("status");

let currentPlayer = "X";
let gameOver = false;

let cells = [
    "", "", "",
    "", "", "",
    "", "", ""
];

let scoreX = 0;
let scoreO = 0;
let draws = 0;

const winningPatterns = [

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]

];

function createBoard() {

    board.innerHTML = "";

    cells.forEach(function(value, index) {

        const cell = document.createElement("div");

        cell.className = "cell";

        if (value === "X") {
            cell.classList.add("x");
        }

        if (value === "O") {
            cell.classList.add("o");
        }

        cell.textContent = value;

        cell.onclick = function() {
            playMove(index);
        };

        board.appendChild(cell);

    });
}

function playMove(index) {

    if (cells[index] !== "" || gameOver) {
        return;
    }

    cells[index] = currentPlayer;

    createBoard();

    if (checkWinner()) {

        statusText.textContent =
            "Player " + currentPlayer + " Wins!";

        gameOver = true;

        if (currentPlayer === "X") {
            scoreX++;
        } else {
            scoreO++;
        }

        updateScore();

        return;
    }

    if (cells.every(function(cell) {
        return cell !== "";
    })) {

        statusText.textContent = "Game Draw!";

        draws++;

        gameOver = true;

        updateScore();

        return;
    }

    if (currentPlayer === "X") {
        currentPlayer = "O";
    } else {
        currentPlayer = "X";
    }

    statusText.textContent =
        "Player " + currentPlayer + "'s Turn";
}

function checkWinner() {

    return winningPatterns.some(function(pattern) {

        const a = pattern[0];
        const b = pattern[1];
        const c = pattern[2];

        return (
            cells[a] !== "" &&
            cells[a] === cells[b] &&
            cells[a] === cells[c]
        );

    });
}

function restartGame() {

    cells = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];

    currentPlayer = "X";

    gameOver = false;

    statusText.textContent =
        "Player X's Turn";

    createBoard();
}

function resetScore() {

    scoreX = 0;
    scoreO = 0;
    draws = 0;

    updateScore();

    restartGame();
}

function updateScore() {

    document.getElementById("scoreX").textContent = scoreX;

    document.getElementById("scoreO").textContent = scoreO;

    document.getElementById("draws").textContent = draws;
}

createBoard();

</script>

</body>
</html>
